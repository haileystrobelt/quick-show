<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>Quick Show</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" sizes="192x192"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#fff;font-family:system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 14px;gap:12px}h1{font-size:26px;margin:0}p{color:#a1a5b0;margin:5px 0 0;font-size:13px}.btn{background:#292c34;color:white;border:1px solid #444852;border-radius:12px;padding:11px 17px}.list{padding:12px 16px 28px;overflow:auto;flex:1}.item{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:#1e2026;color:white;border:1px solid #343741;border-radius:16px;padding:18px 16px;margin-bottom:11px;min-height:76px}.glyph{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#30333b;font-size:22px}.info{flex:1;min-width:0}.name{font-weight:650;font-size:17px}.hint{font-size:12px;color:#999eaa;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arrow{font-size:27px;color:#9da1aa}.page{position:fixed;inset:0;display:none;flex-direction:column;background:#101114;z-index:2;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.page.active{display:flex}.preview{background:#fff;color:#111;z-index:5}.preview header{padding:15px 17px}.preview .btn{background:#eee;color:#111;border:0}.previewBody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}.previewText{text-align:center;font-weight:750;line-height:1.1;overflow-wrap:anywhere;white-space:pre-wrap;width:100%;font-size:64px}.previewBody img{max-width:100%;max-height:100%;object-fit:contain}.form{padding:8px 20px 30px;overflow:auto;flex:1}label{display:block;font-size:12px;color:#b0b4be;margin:20px 0 7px}input:not([type=file]),textarea,select{width:100%;border-radius:11px;background:#252830;color:#fff;border:1px solid #4b505c;padding:13px}textarea{min-height:130px;resize:vertical}.primary{border:0;border-radius:12px;background:white;color:#111;padding:15px;font-weight:700;width:100%}.danger{width:100%;color:#ff9b9b;margin-top:12px}.foot{padding:14px 18px;border-top:1px solid #292c34}#imagePreview{max-width:100%;max-height:220px;object-fit:contain;margin-top:14px;border-radius:10px;display:none}#app{height:100dvh;display:flex;flex-direction:column;max-width:680px;margin:auto}@media(min-width:700px){#app{border-left:1px solid #343741;border-right:1px solid #343741}}.empty{color:#aaa;text-align:center;margin:25px 0}
</style></head><body><main id="app"><header><div><h1>Quick Show</h1><p>Tap an item to display it</p></div><button class="btn" id="editBtn">✎ Edit</button></header><section class="list" id="items"></section></main>
<section class="page preview" id="preview"><header><button class="btn" id="backBtn" aria-label="Back" title="Back" style="font-size:26px;line-height:1;padding:8px 14px">←</button></header><div class="previewBody" id="previewBody"></div></section>
<section class="page" id="editor"><header><h1>Edit items</h1><button class="btn" id="doneBtn">Done</button></header><div class="list" id="editList"></div><div class="foot"><button class="primary" id="addBtn">+ Add new item</button></div></section>
<section class="page" id="formPage"><header><h1 id="formTitle">Edit item</h1><button class="btn" id="cancelBtn">Cancel</button></header><div class="form"><label for="itemLabel">ITEM NAME</label><input id="itemLabel" placeholder="e.g. Membership card"><label for="itemType">DISPLAY TYPE</label><select id="itemType"><option value="text">Large text</option><option value="image">Picture / card</option></select><div id="textFields"><label for="itemValue">TEXT TO SHOW</label><textarea id="itemValue" placeholder="Enter the information to display"></textarea></div><div id="imageFields" hidden><label for="itemFile">UPLOAD IMAGE</label><input type="file" accept="image/*" id="itemFile"><img id="imagePreview" alt="Uploaded image preview"></div><button class="primary" id="saveBtn" style="margin-top:28px">Save item</button><button class="btn danger" id="deleteBtn">Delete item</button></div></section>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const defaults=[{label:'Name',type:'text',value:''},{label:'Phone Number',type:'text',value:''},{label:'Address',type:'text',value:''},{label:'EOS Card',type:'image',value:''}];let items=defaults.map(x=>({...x})),index=-1,imageData='';try{const stored=JSON.parse(localStorage.getItem('quickshow-v2'));if(Array.isArray(stored))items=stored.filter(x=>x&&typeof x.label==='string'&&['text','image'].includes(x.type)&&typeof x.value==='string')}catch(e){}function persist(){try{localStorage.setItem('quickshow-v2',JSON.stringify(items));return true}catch(e){alert('Unable to save: browser storage may be full. Use a smaller picture.');return false}}function close(id){$(id).classList.remove('active')}function open(id){$(id).classList.add('active')}function button(label,sub,icon,action){const b=document.createElement('button');b.className='item';const g=document.createElement('span');g.className='glyph';g.textContent=icon;const info=document.createElement('div');info.className='info';const n=document.createElement('div');n.className='name';n.textContent=label;const h=document.createElement('div');h.className='hint';h.textContent=sub;info.append(n,h);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='›';b.append(g,info,arrow);b.onclick=action;return b}function render(){const list=$('items');list.replaceChildren();items.forEach((it,i)=>list.append(button(it.label,it.value?(it.type==='image'?'Image ready':it.value):'Tap Edit to set up',it.type==='image'?'▣':'▤',()=>show(i))));if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='No items yet. Tap Edit to add one.';list.append(p)}}function fitText(){const box=$('previewBody'),node=box.querySelector('.previewText');if(!node)return;let size=Math.min(110,Math.max(40,box.clientWidth/5));node.style.fontSize=size+'px';while(size>18&&(node.scrollHeight>box.clientHeight-12||node.scrollWidth>box.clientWidth-12)){size-=2;node.style.fontSize=size+'px'}}function show(i){const it=items[i],body=$('previewBody');body.replaceChildren();if(it.type==='image'&&it.value){const img=document.createElement('img');img.src=it.value;img.alt=it.label;body.append(img)}else{const text=document.createElement('div');text.className='previewText';text.textContent=it.value||'Not set yet';body.append(text)}open('preview');requestAnimationFrame(fitText)}window.addEventListener('resize',fitText);function renderEditor(){const list=$('editList');list.replaceChildren();items.forEach((it,i)=>list.append(button(it.label,'Tap to edit',it.type==='image'?'▣':'✎',()=>openForm(i))))}function toggleType(){const isImage=$('itemType').value==='image';$('textFields').hidden=isImage;$('imageFields').hidden=!isImage;$('imagePreview').style.display=isImage&&imageData?'block':'none';if(imageData)$('imagePreview').src=imageData}function openForm(i){index=i;const it=i<0?{label:'',type:'text',value:''}:items[i];imageData=it.type==='image'?it.value:'';$('formTitle').textContent=i<0?'New item':'Edit item';$('itemLabel').value=it.label;$('itemType').value=it.type;$('itemValue').value=it.type==='text'?it.value:'';$('itemFile').value='';$('deleteBtn').hidden=i<0;toggleType();open('formPage')}$('editBtn').onclick=()=>{renderEditor();open('editor')};$('doneBtn').onclick=()=>{close('editor');render()};$('backBtn').onclick=()=>close('preview');$('addBtn').onclick=()=>openForm(-1);$('cancelBtn').onclick=()=>close('formPage');$('itemType').onchange=toggleType;$('itemFile').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Choose an image file.');return}const reader=new FileReader();reader.onload=()=>{imageData=String(reader.result);toggleType()};reader.readAsDataURL(file)};$('saveBtn').onclick=()=>{const label=$('itemLabel').value.trim();if(!label){alert('Enter an item name.');return}const type=$('itemType').value;const obj={label,type,value:type==='image'?imageData:$('itemValue').value};const previous=items.slice();if(index<0)items.push(obj);else items[index]=obj;if(!persist()){items=previous;return}close('formPage');renderEditor();render()};$('deleteBtn').onclick=()=>{if(index<0||!confirm('Delete this item?'))return;const previous=items.slice();items.splice(index,1);if(!persist()){items=previous;return}close('formPage');renderEditor();render()};document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('preview').classList.contains('active'))close('preview');else if($('formPage').classList.contains('active'))close('formPage');else close('editor')});render()})();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
